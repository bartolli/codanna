<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>index_file_single - Relationship Graph</title>
  <style>
    body {
      margin: 0;
      background: #000003;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #3d-graph { width: 100vw; height: 100vh; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(20, 20, 30, 0.9);
      color: #e0e0e0;
      padding: 15px;
      border-radius: 8px;
      font-size: 13px;
      max-width: 350px;
      border: 1px solid #333;
    }
    #info h3 { margin: 0 0 10px; color: #fff; }
    #info .stat { margin: 5px 0; }
    #info .legend { margin-top: 15px; }
    #info .legend-item {
      display: inline-block;
      margin-right: 12px;
      white-space: nowrap;
    }
    #info .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    #tooltip {
      position: absolute;
      background: rgba(10, 10, 20, 0.95);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      pointer-events: none;
      display: none;
      max-width: 450px;
      border: 1px solid #444;
      line-height: 1.5;
    }
    #tooltip .header { display: flex; align-items: baseline; margin-bottom: 8px; }
    #tooltip .name { font-weight: bold; font-size: 14px; color: #fff; }
    #tooltip .kind { color: #888; margin-left: 8px; font-size: 12px; }
    #tooltip .lang { color: #6cf; margin-left: 8px; font-size: 11px; }
    #tooltip .meta { color: #aaa; font-size: 11px; margin-bottom: 6px; }
    #tooltip .meta span { margin-right: 12px; }
    #tooltip .file { color: #6cf; font-size: 11px; margin-bottom: 6px; }
    #tooltip .module { color: #9d9; font-size: 11px; margin-bottom: 6px; }
    #tooltip .signature {
      background: rgba(255,255,255,0.05);
      padding: 6px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      color: #ccc;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #logo {
      position: absolute;
      bottom: 16px;
      right: 16px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    #logo:hover { opacity: 1; }
    #logo img { height: 32px; }
  </style>
</head>

    const colorsByGroup = {
      0: '#888888',
      1: '#ff6b6b',
      2: '#4ecdc4',
      3: '#ffe66d',
      4: '#95e1d3',
      5: '#dda0dd',
      6: '#87ceeb',
      7: '#ffa07a',
      8: '#98fb98',
      9: '#deb887'
    };

    const nodeColorScale = node => node.level === 0 ? '#ffffff' : (colorsByGroup[node.group] || colorsByGroup[0]);
    const tooltip = document.getElementById('tooltip');

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatTooltip(node) {
      let html = '<div class="header">';
      html += '<span class="name">' + escapeHtml(node.name) + '</span>';
      html += '<span class="kind">' + escapeHtml(node.kind) + '</span>';
      if (node.language) {
        html += '<span class="lang">[' + escapeHtml(node.language) + ']</span>';
      }
      html += '</div>';

      // Meta info
      const meta = [];
      if (node.visibility) meta.push(node.visibility);
      if (node.line) {
        const range = node.endLine && node.endLine !== node.line
          ? node.line + '-' + node.endLine
          : node.line;
        meta.push('L' + range);
      }
      if (meta.length) {
        html += '<div class="meta">' + meta.map(m => '<span>' + escapeHtml(m) + '</span>').join('') + '</div>';
      }

      // File path
      if (node.file) {
        html += '<div class="file">' + escapeHtml(node.file) + '</div>';
      }

      // Module path
      if (node.module) {
        html += '<div class="module">' + escapeHtml(node.module) + '</div>';
      }

      // Signature (truncate if too long)
      if (node.signature) {
        let sig = node.signature;
        if (sig.length > 200) sig = sig.slice(0, 200) + '...';
        html += '<div class="signature">' + escapeHtml(sig) + '</div>';
      }

      return html;
    }

    const Graph = new ForceGraph3D(document.getElementById('3d-graph'))
      .backgroundColor('#000003')
      .nodeLabel(() => '')
      .nodeColor(nodeColorScale)
      .nodeVal(node => node.level === 0 ? 4 : 2)
      .linkThreeObject(link => {
        const colors = new Float32Array([].concat(
          ...[link.source, link.target]
            .map(nodeColorScale)
            .map(d3Color)
            .map(({ r, g, b }) => [r, g, b].map(v => v / 255))
        ));

        const material = new THREE.LineBasicMaterial({ vertexColors: true });
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(2 * 3), 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        return new THREE.Line(geometry, material);
      })
      .linkPositionUpdate((line, { start, end }) => {
        const startR = Graph.nodeRelSize();
        const endR = Graph.nodeRelSize();
        const lineLen = Math.sqrt(['x', 'y', 'z'].map(dim => Math.pow((end[dim] || 0) - (start[dim] || 0), 2)).reduce((acc, v) => acc + v, 0));

        const linePos = line.geometry.getAttribute('position');
        linePos.set([startR / lineLen, 1 - endR / lineLen].map(t =>
          ['x', 'y', 'z'].map(dim => start[dim] + (end[dim] - start[dim]) * t)
        ).flat());
        linePos.needsUpdate = true;
        return true;
      })
      .onNodeHover(node => {
        document.body.style.cursor = node ? 'pointer' : 'default';
        if (node) {
          tooltip.innerHTML = formatTooltip(node);
          tooltip.style.display = 'block';
        } else {
          tooltip.style.display = 'none';
        }
      })
      .onNodeClick(node => {
        const distance = 100;
        const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
        Graph.cameraPosition(
          { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
          node,
          1000
        );
      })
      .graphData(graphData);

    // Add glow effect
    const bloomPass = new UnrealBloomPass();
    bloomPass.strength = 2;
    bloomPass.radius = 0.5;
    bloomPass.threshold = 0.1;
    Graph.postProcessingComposer().addPass(bloomPass);

    document.addEventListener('mousemove', function(e) {
      tooltip.style.left = (e.clientX + 15) + 'px';
      tooltip.style.top = (e.clientY + 15) + 'px';
    });

    document.getElementById('reset-btn').addEventListener('click', function() {
      Graph.cameraPosition({ x: 0, y: 0, z: 300 }, { x: 0, y: 0, z: 0 }, 1000);
    });

    // Responsive resize
    window.addEventListener('resize', function() {
      Graph.width(window.innerWidth);
      Graph.height(window.innerHeight);
    });
